# fly.toml app configuration file generated for arxiv-connections on 2026-08-14T00:35:08-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'arxiv-connections'
primary_region = 'iad'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

# The day's puzzle and the recorded impostor guesses live here. Without a volume
# both are lost every time a machine stops or is replaced — and with
# auto_stop_machines the machine stops whenever the game is idle, which would
# reset the guess tallies before they ever reach the 10-player threshold.
[[mounts]]
  source = 'data'
  destination = '/data'

[env]
  ARXIV_STATS_DIR = '/data/stats'
  ARXIV_CACHE_DIR = '/data/cache'

[[vm]]
  # Measured peak is ~37 MB, including a cold puzzle build and 200 concurrent
  # requests, so 256 MB is ample. (`fly config save` emitted both memory and
  # memory_mb; only one is kept so the size is unambiguous.)
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
