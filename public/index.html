<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>arXiv Connections</title>
<meta name="description" content="A daily puzzle: sort sixteen arXiv paper titles into the four categories they were announced in.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23b31b1b'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='19' font-weight='700' fill='%23fff' text-anchor='middle'%3E%CF%87%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="masthead">
  <button type="button" id="statsBtn" class="statsbtn" aria-haspopup="dialog">
    <svg class="statsbtn__icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
      <rect x="1" y="9" width="3.4" height="6" rx="1.2"/>
      <rect x="6.3" y="5.5" width="3.4" height="9.5" rx="1.2"/>
      <rect x="11.6" y="2" width="3.4" height="13" rx="1.2"/>
    </svg>
    Stats
  </button>
  <h1>arXiv <span>Connections</span></h1>
  <p class="masthead__sub">
    Find the four groups of papers that share an arXiv category.
    <span id="announced" class="masthead__date"></span>
  </p>
</header>

<main id="board" class="board" aria-busy="true">
  <!-- The four answers, hidden until found. -->
  <ol id="slots" class="slots" aria-label="Categories found"></ol>

  <!-- Solved (or revealed) groups, with the papers they contained. -->
  <div id="solved" class="solved"></div>

  <!-- The remaining titles. -->
  <div id="grid" class="grid" role="group" aria-label="Paper titles"></div>

  <p id="status" class="status" role="status" aria-live="polite"></p>

  <div id="loading" class="loading">Fetching today’s papers from arXiv…</div>
</main>

<div class="controls" id="controls" hidden>
  <div class="controls__inner">
    <div class="strikes" id="strikes" aria-label="Mistakes remaining">
      <span class="strikes__label">Mistakes</span>
      <span class="strikes__dots" id="strikeDots"></span>
    </div>
    <div class="controls__buttons">
      <button type="button" id="shuffle" class="btn btn--ghost">Shuffle</button>
      <button type="button" id="deselect" class="btn btn--ghost" disabled>Deselect</button>
      <button type="button" id="check" class="btn btn--primary" disabled>Check</button>
    </div>
  </div>
</div>

<dialog id="statsDialog" class="statsdialog" aria-labelledby="statsTitle">
  <h2 id="statsTitle">Your stats</h2>
  <dl class="statsgrid" id="statsGrid"></dl>
  <p class="statsdialog__note" id="statsNote"></p>
  <div class="statsdialog__foot">
    <button type="button" id="clearStats" class="linkbtn">Clear my stats</button>
    <form method="dialog">
      <button class="btn btn--primary" autofocus>Close</button>
    </form>
  </div>
</dialog>

<footer class="colophon">
  <p>
    Titles come from the arXiv daily announcement feeds. A new puzzle appears at 2:00&nbsp;am US&nbsp;Eastern.
    <a href="https://arxiv.org" rel="noopener">arXiv.org</a>
  </p>
</footer>

<script defer src="vendor/katex/katex.min.js"></script>
<script defer src="vendor/katex/auto-render.min.js"></script>
<script defer src="app.js"></script>
</body>
</html>
